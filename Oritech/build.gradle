plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
group = 'dev.everyonemek'
version = mod_version
base { archivesName = 'OritechMekanism' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
def withThings = providers.gradleProperty('withThings').map { it.toBoolean() }.getOrElse(false)
sourceSets {
    gameTest { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
repositories {
    maven { url = 'https://modmaven.dev/'; content { includeGroup 'mekanism' } }
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'rearth.oritech'; includeGroup 'mezz.jei' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.teamresourceful.com/repository/maven-public/'; content { includeGroup 'earth.terrarium.athena' } }
    mavenCentral()
}
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir(providers.gradleProperty('gameTestDirectory').orElse('gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'oritechmekanism'
        }
    }
    mods { oritechmekanism { sourceSet sourceSets.main; sourceSet sourceSets.gameTest } }
}
dependencies {
    implementation "mekanism:Mekanism:${mekanism_version}"
    // Avoid Oritech's optional Jade runtime and a second copy of its bundled GrandPower.
    implementation("rearth.oritech:oritech-neoforge-1.21.1:${oritech_version}") { transitive = false }
    implementation 'maven.modrinth:architectury-api:1IiqEQGl'
    implementation 'maven.modrinth:geckolib:qj2pTqCr'
    runtimeOnly 'earth.terrarium.athena:athena-neoforge-1.21:4.0.0'
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.25.0.322'
    runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.25.0.322'
    if (withThings) runtimeOnly 'maven.modrinth:oritech-things:vt3nmngK'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('check') { dependsOn 'compileGameTestJava' }
tasks.named('jar', Jar) { from('LICENSE'); from('THIRD_PARTY_NOTICES.md') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def resourceProperties = [version: project.version.toString()]
tasks.named('processResources', ProcessResources) {
    inputs.properties(resourceProperties)
    filesMatching('META-INF/neoforge.mods.toml') { expand(resourceProperties) }
}
