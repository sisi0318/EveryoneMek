<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>引力堆 · 三维建模稿</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<header><div><span class="eyebrow">MEK GRAVITY / MODEL STUDY 01</span><h1>引力约束反应堆<span>三维灰模</span></h1></div><div class="header-right"><span>7 × 7 × 7</span><a href="reactor-graybox-v1.zip" download>下载建模包 ↗</a></div></header>
<main>
<section class="viewport" aria-label="反应堆三维预览">
<canvas id="scene" tabindex="0" aria-label="拖动旋转，滚轮缩放，点击选择部件"></canvas>
<div class="stage-top"><span class="pill" id="mode-name">剖开查看</span><span id="part-count"></span></div>
<div class="view-presets" aria-label="视角"><button data-view="home" class="active">透视</button><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="top">顶部</button><button id="reset" title="恢复初始视角与显示">重置</button></div>
<div class="stage-bottom"><span><i></i>真实几何 · 无贴图</span><span>拖动旋转 · 右键拖动平移 · 滚轮缩放 · 点击部件</span></div>
<div id="failure" hidden></div>
</section>
<aside>
<div class="section"><div class="section-head"><span class="step">01</span><h2>装配方式</h2></div>
<div class="segmented three"><button data-mode="cut" aria-pressed="true">剖开</button><button data-mode="full" aria-pressed="false">完整</button><button data-mode="inside" aria-pressed="false">内腔</button></div>
<label class="slider-label" for="explode">爆炸分解 <output id="explode-value">0%</output></label><input id="explode" type="range" min="0" max="100" value="0">
<p class="hint">剖开时隐藏顶板与正面玻璃，保留全部结构在模型中。</p></div>
<div class="section"><div class="section-head"><span class="step">02</span><h2>结构层次</h2></div>
<label class="toggle"><input id="frames" type="checkbox" checked><span>框架、接头与装甲</span></label>
<label class="toggle"><input id="windows" type="checkbox" checked><span>内嵌观察窗</span></label>
<label class="toggle"><input id="emitters" type="checkbox" checked><span>六向约束发射器</span></label>
<label class="toggle"><input id="core" type="checkbox" checked><span>悬浮核心与金属环</span></label>
</div>
<div class="section"><div class="section-head"><span class="step">03</span><h2>查看几何</h2></div>
<div class="segmented"><button data-palette="gray" aria-pressed="true">灰模</button><button data-palette="color" aria-pressed="false">部件分色</button></div>
<div class="toggle-row"><label class="toggle"><input id="wire" type="checkbox"><span>线框</span></label><label class="toggle"><input id="grid" type="checkbox" checked><span>地面网格</span></label></div></div>
<div class="selection" aria-live="polite"><span class="eyebrow">选中部件</span><h3 id="selection-title">点击模型查看</h3><p id="selection-detail">先看轮廓、凹凸和连接，再确定材质。</p><button id="clear-selection" hidden>取消选择</button></div>
<button id="reference-button" class="reference-button">对照最早概念图 <span>↗</span></button>
<p class="stage-note">建模审查稿，尚未接入游戏。发射头向内伸出 ¼ 格，窗面合并展示；这些是本次需要确认的比例。</p>
</aside>
</main>
<dialog id="reference"><button id="close-reference" aria-label="关闭参考图">×</button><img src="concept-reference.png" alt="最早的引力堆剖视概念图"><p>最早概念图 · 对照立柱、发射头、窗沿和底座层次</p></dialog>
<script src="scene.js"></script><script src="viewer.js"></script>
</body></html>
