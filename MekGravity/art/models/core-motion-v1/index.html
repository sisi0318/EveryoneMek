<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>引力核心 · 运行动画</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#141b22;color:#dce5ec;font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:25px 28px 18px;border-bottom:1px solid #34414c}.eyebrow{font-size:10px;letter-spacing:2px;color:#929fab}h1{font-size:24px;font-weight:550;margin:5px 0}header p{color:#a4b0bb;font-size:12px;margin:0}main{max-width:1140px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:20px}.stage{min-height:560px;position:relative;background:radial-gradient(ellipse,#24263b,#151d25 70%);border:1px solid #35414c}canvas{width:100%;height:100%;position:absolute;inset:0;touch-action:none}.badge{position:absolute;left:18px;top:16px;font-size:11px;color:#d5c5ee;border:1px solid #645578;background:#1e2032;padding:3px 10px;pointer-events:none}.instructions{position:absolute;bottom:14px;left:18px;font-size:11px;color:#7d8d9d;pointer-events:none}aside{background:#202a33;border:1px solid #35414c;padding:20px}h2{font-size:13px;font-weight:550;margin:0 0 14px}.buttons{display:flex;gap:6px;margin-bottom:22px}button{flex:1;padding:8px;border:1px solid #52616f;color:#cdd6de;background:#26323d;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#635477;border-color:#a998bd;color:white}label{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;font-size:12px}input[type=range]{width:100%;accent-color:#b299d4}.info{margin:22px 0;padding-top:16px;border-top:1px solid #43515c;color:#adbac5;font-size:12px}.info p{margin:10px 0}.note{font-size:11px;color:#899baa;margin-top:20px}output{color:#ded0f0;font-variant-numeric:tabular-nums}button:focus-visible,input:focus-visible{outline:2px solid #cebbeb;outline-offset:3px}@media(max-width:800px){main{grid-template-columns:1fr;padding:14px}.stage{min-height:480px}aside{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}.info{margin:0;border:0;padding:0}.note{grid-column:1/-1;margin:8px 0}}
</style></head><body><header><div class="eyebrow">MEK GRAVITY / CORE MOTION</div><h1>引力核心 · 运行动画</h1><p>内核自转 / 双环反向旋转 / 六向汇聚</p></header><main><section class="stage"><canvas id="motion" aria-label="核心动画，拖动可旋转观察视角" tabindex="0"></canvas><span class="badge" id="state">启动中</span><span class="instructions">拖动旋转视角 · 滚轮缩放</span></section><aside><div><h2>运行状态</h2><div class="buttons"><button id="start" aria-pressed="true">运行</button><button id="stop" aria-pressed="false">停机</button></div><label for="load">实际发电负载 <output id="load-value">100%</output></label><input id="load" type="range" min="1" max="100" value="100"><label for="beams">显示六向束流 <input id="beams" type="checkbox" checked></label></div><div class="info"><p>负载越高，转速越快，束流越亮。</p><p>启动时逐渐加速；停机时减速、收束，保留核心和金属环。</p><p>球体轻微浮动与呼吸缩放，金属环各自沿相反方向旋转。</p></div><p class="note">运动示意使用游戏导出的球体和环几何；转速、过渡和束流轨迹与代码一致。此页用简化着色，实际贴图与透光效果以游戏为准。</p></aside></main><script src="mesh.js"></script><script src="motion.js"></script></body></html>
