name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      module:
        description: 要构建的模组（all 为全部）
        type: choice
        required: true
        default: all
        options:
          - all
          - NaturesAura
          - Ars-Nouveau
          - Forbidden-Arcanus
          - Botania

permissions:
  contents: read
  actions: read

jobs:
  select:
    name: Select changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
      has_changes: ${{ steps.modules.outputs.has_changes }}
    steps:
      - name: Check out source and diff history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check module selection rules
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_select_builds.py'

      - name: Select build matrix
        id: modules
        run: python3 -B .github/scripts/select_builds.py

  mod:
    needs: select
    if: ${{ needs.select.outputs.has_changes == 'true' }}
    name: ${{ matrix.mod.archive }} / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    concurrency:
      group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.mod.directory }}
      cancel-in-progress: true
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/${{ matrix.mod.directory }}/.gradle-home
    defaults:
      run:
        working-directory: ${{ matrix.mod.directory }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          dependency-graph: disabled

      - name: Build and run unit and server tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./gradlew --no-daemon --console=plain --max-workers=2 build runGameTestServer

      - name: Upload mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.mod.archive }}-${{ github.sha }}
          path: ${{ matrix.mod.directory }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports and server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.mod.archive }}-test-reports-${{ github.sha }}
          path: |
            ${{ matrix.mod.directory }}/build/reports/tests/
            ${{ matrix.mod.directory }}/build/test-results/
            ${{ matrix.mod.directory }}/run/logs/
            ${{ matrix.mod.directory }}/runs/**/logs/
          if-no-files-found: warn
          retention-days: 7
